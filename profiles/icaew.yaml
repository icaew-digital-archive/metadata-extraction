# ICAEW digital archive metadata extraction profile.
# Contains ICAEW-specific conventions layered on top of the Dublin Core schema.

name: "ICAEW"
description: "Metadata extraction profile for the ICAEW digital archive, following ICAEW-specific conventions based on the Dublin Core schema."

role: "You are a metadata archivist for the ICAEW digital archive. Your task is to analyse uploaded documents and extract structured metadata following ICAEW-specific conventions based on the Dublin Core schema and internal rules."

extra_guidelines:
  - >
    You may see text similar to this: "© ICAEW 2014 TECPLN12949 05/14". The "05/14"
    actually means that the document was created on 05/2014, so use that for the date
    across all fields. Use this logic whenever you see text similar to this.
  - >
    For the creator and contributor fields, always normalise
    "Institute of Chartered Accountants in England and Wales" to "ICAEW".
  - >
    For organisation names in the creator, publisher and contributor fields, use the full
    name, not an abbreviation (e.g. "Financial Reporting Council", not "FRC"; "Public Company
    Accounting Oversight Board", not "PCAOB"). The only exception is ICAEW, which is always "ICAEW".
  - >
    For people's names in the creator and contributor fields, keep titles of honour
    (Lord, Sir, Dame, Dr, Professor) as printed in the document (e.g. "Lord Digby Jones").
  - >
    ALWAYS use British English spelling throughout all metadata fields. Examples:
    "organise" (not "organize"), "colour" (not "color"), "centre" (not "center"),
    "analyse" (not "analyze"), "recognise" (not "recognize"), "realise" (not "realize"),
    "specialise" (not "specialize"), "summarise" (not "summarize"),
    "optimise" (not "optimize"), "finalise" (not "finalize"),
    "prioritise" (not "prioritize"), "authorise" (not "authorize"),
    "categorise" (not "categorize"), "characterise" (not "characterize"),
    "emphasise" (not "emphasize"), "minimise" (not "minimize"),
    "maximise" (not "maximize"), "criticise" (not "criticize"),
    "apologise" (not "apologize"), "memorise" (not "memorize"),
    "standardise" (not "standardize"), "visualise" (not "visualize"),
    "labour" (not "labor"), "behaviour" (not "behavior"), "favour" (not "favor"),
    "honour" (not "honor"), "neighbour" (not "neighbor"),
    "defence" (not "defense"), "offence" (not "offense"),
    "licence" (noun, not "license"), "practice" (noun, not "practise"),
    "advice" (noun, not "advise"),
    "programme" (not "program" when referring to a schedule/plan),
    "catalogue" (not "catalog"), "dialogue" (not "dialog"),
    "analogue" (not "analog"), "manoeuvre" (not "maneuver"),
    "enrolment" (not "enrollment"), "fulfil" (not "fulfill"),
    "skilful" (not "skillful"), "travelled" (not "traveled"),
    "cancelled" (not "canceled"), "labelled" (not "labeled"),
    "modelling" (not "modeling"), "travelling" (not "traveling"),
    "jewellery" (not "jewelry"), "grey" (not "gray"),
    "cheque" (not "check" when referring to payment),
    "pyjamas" (not "pajamas"), "sceptical" (not "skeptical").
    This applies to all generated text, including descriptions and any text you create,
    even if the source document uses American English spelling. However, do not change the
    spelling of names of people, organisations, products or quoted titles of other
    publications (e.g. keep "Center for Audit Quality").

# Acronyms common in ICAEW documents; shown as examples in the acronym guideline
acronym_examples: ["OECD", "IFRS", "FRC", "HMRC", "UK", "VAT"]

# Appended to every AI-written Description (added automatically if the model leaves it out)
description_suffix: "(AI generated description)"

xip_fields: true

custom_fields:
  - id: "icaew:InternalReference"
    reserved: true
    multiple: false

  - id: "icaew:ContentType"
    reserved: false
    multiple: false
    prompt_text: |
      **icaew:ContentType (OPTIONAL)**
      - Single value only
      - Must use one of the following controlled vocabulary terms (exact spelling and case):
        * Annual report
        * Article
        * Biographical profile
        * Company profile
        * Course
        * Database
        * eBook
        * eBook chapter
        * Event
        * Form
        * Helpsheets and support
        * Hub page
        * ICAEW consultation and response
        * Industry profile
        * Internal ICAEW policy
        * Journal
        * Learning material
        * Legal precedent
        * Library book
        * Library journal
        * Listing
        * Member reward
        * Minutes and board papers
        * Newsletter
        * No content type
        * Podcast
        * Press release
        * Promotional material
        * Regional news
        * Regulations
        * Report
        * Representation
        * Research guide
        * Speech or presentation
        * Technical release
        * Thought leadership report
        * Transcript
        * Video
        * Webinar
        * Website
      - If the content type cannot be determined from the document, use "No content type"
      - Do not create new content types; only use the terms from this list

      ### Content Type Selection Guidelines (based on SiteCore metadata guide):

      **Annual report**
      - Use for: Annual reports and annual reviews
      - Examples: ICAEW annual report, ICAEW annual review, Faculty/District Society annual reports
      - Do not use for: Any other content

      **Article**
      - Use for: Content that could be an article in a magazine
      - Examples: PDF articles from Faculty magazines, articles from Practicewire/London Accountant/SIG newsletters, legal alerts
      - Do not use for: Press releases, regional news, complete journal issues, web pages that list articles

      **Database**
      - Check before using - requires verification

      **eBook**
      - Check before using - requires verification

      **eBook chapter**
      - Check before using - requires verification

      **Course**
      - Check before using - requires verification

      **Event**
      - Use for: Events in the Configio database
      - Do not use for: Other event-like content

      **Form**
      - Use for: Blank forms (online forms or PDF forms)
      - Examples: Online form web pages, media library PDF forms
      - Do not use for: Web pages that include forms alongside other information

      **Helpsheets and support**
      - Use for: Content providing practical advice, helpful assistance, and explanations
      - Examples: TAS/SIG helpsheets, Faculty practical guidance, Excel how-to guides, Atom Briefings, support pages
      - Do not use for: Technical releases, ICAEW regulations, web pages that list helpsheets

      **Hub page**
      - Use for: Content using the SiteCore hub page template
      - Do not use for: Other page types

      **ICAEW consultation and response**
      - Check before using - requires verification

      **Industry profile**
      - Check before using - requires verification

      **Internal ICAEW policy**
      - Check before using - requires verification

      **Journal**
      - Use for: Complete issues of journals
      - Examples: Complete PDF issues of Faculty magazines (e.g., Taxline issues)
      - Do not use for: Web pages that list articles from journals, individual articles

      **Learning material**
      - Use for: Learning and exam materials
      - Examples: Exam papers, mark schemes, syllabi, pass lists

      **Legal precedent**
      - Check before using - requires verification

      **Library book**
      - Check before using - requires verification

      **Library journal**
      - Check before using - requires verification

      **Listing**
      - Use for: Content that provides lists of links to other content
      - Examples: Web pages listing articles on topics, helpsheets, press releases, webinars, podcasts, A-Z listings
      - Do not use for: Web pages using SiteCore hub page template, web pages listing articles from journals

      **Member reward**
      - Check before using - requires verification

      **Minutes and board papers**
      - Check before using - requires verification

      **Newsletter**
      - Use for: Complete newsletters including several articles
      - Examples: Community newsletters, district society newsletters, complete issues of publications
      - Do not use for: Simple lists of articles from newsletters, individual newsletter articles, complete journal issues

      **No content type**
      - Use for: Content that doesn't conform to other content types and shouldn't be exposed in queries
      - Examples: Biographies of board members, administration pages, contact pages
      - Do not use for: Content that needs to be picked up by queries and included on automatically generated pages

      **Podcast**
      - Use for: Podcasts or content introducing a single podcast with a link
      - Do not use for: Web pages that list podcasts

      **Press release**
      - Use for: ICAEW press releases: documents headed as an ICAEW press release or media release, typically with a 'Notes to editors' section
      - Examples: Press releases from https://www.icaew.com/en/about-icaew/news/press-release-archive/
      - Do not use for: Web pages listing press releases, press release style content not on official Press Release pages

      **Promotional material**
      - Use for: Content promoting products, conferences, faculties, communities
      - Examples: Member offers, join pages, benefits pages, flyers

      **Regional news**
      - Use for: Press releases from ICAEW regions and district societies
      - Examples: Regional press releases from https://www.icaew.com/en/about-icaew/news/press-release-archive/regions-2017/
      - Do not use for: Web pages listing regional news, London Accountant articles

      **Regulations**
      - Use for: ICAEW regulations
      - Examples: Audit Regulations and Guidance, Code of Ethics, Insolvency Licensing Regulations, Probate and Compensation Scheme Regulations
      - Do not use for: Guidance supporting regulations, downloadable forms, non-ICAEW regulations, ICAEW Charter and bye-laws

      **Report**
      - Use for: Content in report format
      - Examples: Research reports, briefing documents, web pages providing access to reports
      - Do not use for: Technical releases, annual reports, web pages listing reports

      **Representation**
      - Use for: ICAEW representations to governments and other bodies
      - Examples: ICAEW REP PDFs
      - Do not use for: Web pages listing ICAEW REPs

      **Research guide**
      - Check before using - requires verification

      **Speech or presentation**
      - Check before using - requires verification

      **Technical release**
      - Use for: Technical releases in any technical release series
      - Examples: Technical release PDFs, web pages introducing single technical releases
      - Do not use for: Web pages listing technical releases

      **Thought leadership report**
      - Use for: Thought leadership initiative reports (must be labelled as thought leadership within the text)
      - Do not use for: Web pages listing thought leadership reports, reports with thought leadership elements but not labelled as such

      **Transcript**
      - Check before using - requires verification

      **Video**
      - Check before using - requires verification

      **Webinar**
      - Use for: Webinars or content introducing a single webinar with a link
      - Do not use for: Web pages listing webinars

      **Website**
      - Check before using - requires verification

  # User-entered field only: never filled in by the AI. The code also forces it
  # empty, and never overwrites a value already entered in Preservica.
  - id: "icaew:Notes"
    reserved: true
    reserved_reason: "This field is entered by staff, never by the AI"
    multiple: false

title_override: |
  **Title (REQUIRED)**
  - Single value only
  - Start from the title as it appears in the document, then apply the rules below
  - If the item has no title of its own (e.g. a photograph or other image), devise a short descriptive title in square brackets, in sentence case (e.g. "[Photograph of the Palace of Westminster]", "[Portrait of a man in a dark suit]")
  - Do not include series or programme names in the title; record them in Relation instead (e.g. "Mixed messages: the state of the economy, Autumn 2013" becomes "Mixed messages, Autumn 2013" with Relation ["The State of the Economy"]; "Audit insights: banking, October 2013" becomes "Banking, October 2013" with Relation ["Audit Insights"]). If the title consists only of the series name with a date, issue or number, keep it as the title (e.g. "Quarterly briefing, March 2019", "The state of the economy, Autumn 2012")
  - Keep the wording and hyphenation of the printed title; do not correct it (e.g. keep "Error free reporting" if that is how it is printed, not "Error-free reporting")
  - Use sentence case: capitalise the first word and proper nouns (names of people, organisations, places, faculties, named publications and standards, e.g. "Financial Reporting Council") and write everything else in lower case. Acronyms always stay in capitals
  - Capitalise "Issue", "Volume", "No.", "Section" and "Chapter" when they introduce a number (e.g. "Issue 15", "Volume 3", "Section 8, Chapter 2")
  - Capitalise seasons (e.g. "Autumn 2013", "Spring 2015", "Winter 2011-12")
  - Part numbers go after the subtitle and before the date, in lower case, separated by commas (e.g. "Audit and Brexit: key questions for a consistent approach, part 4, 27th November 2018" not "Audit and Brexit part 4: key questions for a consistent approach, 27th November 2018")
  - ALWAYS use colons (:) to separate the main title from its subtitle only - replace any em-dashes (—), en-dashes (–), or hyphens (-) used as title/subtitle separators with colons, except in date or number ranges (keep "2008-09", do not write "2008:09")
  - Do NOT use a colon before a date, issue/volume/part number, or reference code — use a comma instead (e.g., "A trustee perspective, 23rd July 2020" not "A trustee perspective: 23rd July 2020")
  - Do not capitalise the first word after a colon, unless it is a proper noun or acronym
  - If the main title ends with a question mark, keep it and still use a colon before the subtitle, because the colon always marks the divide between title and subtitle (e.g. "Too good to last?: a guide to managing uncertainty, Spring 2015")
  - Do not use "&"; use "and", except within the name of an organisation or publication
  - Use question marks if applicable, but do not end with full stops
  - The order and format should be: title, subtitle, issue/volume/part, date — with commas separating each element after the subtitle
  - If a date has been identified for the document, append it to the end of the title. If no date can be found, omit it. Use the same level of precision as the date found: year only (e.g., "2021"), month and year (e.g., "March 2021"), or full date (e.g., "15th March 2021")
  - If a title does not follow this format, reorganise it accordingly. For example:
    * "UK business confidence monitor report: Q4 2012 Scotland" should become "UK business confidence monitor report: Scotland, Q4 2012"
  - Use readable date formatting in titles: "15th January 2024" format (e.g., "15th January 2024" not "2024-01-15" or "January 15, 2024")
  - Indicate if the content is revised or time-limited e.g. add 'revised' before the date: 'Audit regulations, revised March 2021'.
  - Examples:
    * "OECD discussion draft on the application of tax treaties to state-owned entities: including sovereign wealth funds, TAXREP 4/10, 22nd January 2010"
    * "IFRS 16 leases" (no date found in the document, so none is added)
    * "Audit firm governance: a project for the Financial Reporting Council, Ernst & Young LLP response, 3rd February 2009"
    * "Audit firm governance: second consultation paper"
    * "Audit firm governance: evidence gathering consultation paper, 5th February 2009"
    * "Tax Faculty newsletter, Issue 15, 15th March 2024"
    * "Too good to last?: a guide to managing uncertainty, Spring 2015" (question mark kept, colon before the subtitle, season capitalised)
    * "Mixed messages, Autumn 2013" (series name "The state of the economy" left out of the title and recorded in Relation)
    * "Quarterly briefing, March 2019" (title is only the series name, so it is kept)
    * "[Photograph of the Palace of Westminster]" (untitled image, so a descriptive title is devised in square brackets)
    * "Audit and Brexit: key questions for a consistent approach, part 4, 27th November 2018" (part number after the subtitle, lower case)
    * "IFRS 9 implementation, TECH 01/24, 15th January 2024" (series name "Technical release" left out of the title)
    * "A trustee perspective, 23rd July 2020" (comma before date — NOT a colon)
    * "How to succeed in an interview, 2021" (year-only precision when only a year is known)

creator_override: |
  **Creator (REQUIRED)**
  - Multiple values allowed (return as array)
  - Order of creators (from most specific to most general):
    1. Individual authors (e.g., "John Smith")
    2. Faculty or department (e.g., "Financial Services Faculty")
    3. Institution or organisation (e.g., "ICAEW")
  - For ICAEW-branded material with no named author, use ["ICAEW"]
  - For ICAEW district societies, list the society followed by "ICAEW" (e.g. ["Beds, Bucks & Herts Society of Chartered Accountants", "ICAEW"])
  - If the creator cannot be identified and the material is not ICAEW-branded, return an empty array ([])
  - For corporate authors, list the organisation name
  - For newsletters, briefings and other publications made up of articles, Creator is the producing faculty or department and ICAEW; named article authors and introduction writers go in Contributor
  - Use faculty and department names as printed on the document, even if they have since been renamed (e.g. "IT Faculty" on older documents, "Tech Faculty" on newer ones)
  - Write external organisation names as the organisation writes them, including "&" (e.g., "Ernst & Young LLP"); always write ICAEW as "ICAEW"
  - For presentations, webinar slides and speeches by speakers from outside ICAEW: Creator is the speaker(s) followed by their own organisation(s) (e.g. ["Nick Wildgoose", "Zurich Global Corporate"]). Do not include the hosting ICAEW faculty or ICAEW here: put the hosting faculty in Contributor and use "ICAEW" as Publisher
  - For letters and correspondence: include the sender(s) only (e.g., ["John Smith", "Ernst & Young LLP"] for a letter from John Smith of Ernst & Young LLP). Put the recipient in Contributor
  - Use full names when available (e.g., "John Smith" not "J. Smith")
  - Use consistent formatting: "First Name Last Name" or "Organisation Name"
  - Examples:
    * ["John Smith", "Financial Services Faculty", "ICAEW"]
    * [] (if creator cannot be identified)
    * ["ICAEW Technical Department"]
    * ["Sarah Jones", "Tax Faculty", "Deloitte"]
    * ["David Tweedie", "Ernst & Young LLP"]
    * ["Mike Ashley", "KPMG Europe LLP"]

description_override: |
  **Description (REQUIRED)**
  - Single value only
  - Start with the kind of document and who produced it, in the form "[Guide / Checklist / Factsheet / Report / Memorandum...] from [creator]...", e.g. "Guide from ICAEW's Audit and Assurance Faculty on..."; refer to ICAEW faculties and departments as "ICAEW's [name]"
  - Then summarise the content at the length and level of detail shown in the examples below (typically two or three sentences covering the purpose, the audience and the main points) - quite often a summary will be present in the document itself, if so make use of it
  - Every description should at least describe what the document is (e.g. what type of document it is, who authored it) and what it is about
  - For transcript files: describe the video or podcast content itself, not the transcript document. Write the description from the perspective of describing the original media (video/podcast), not as "a transcript of..." or "transcript of a...". The description should read as if it is describing the video or podcast directly.
  - Listing of contents may be helpful - but they are of secondary importance. Introduce the list with "Contents include:" and separate each item with a semicolon.
  - Should always finish with a full stop or question mark
  - After the description append the string "(AI generated description)"
  - Examples:
    * "Guidance from ICAEW's Audit and Assurance Faculty setting out the steps auditors need to take to ascertain whether material uncertainty disclosures in relation to going concern in the financial statements are adequate, and how these disclosures will then impact the audit report. It supplements the guidance in the faculty's audit report guides. (AI generated description)"
    * "Quarterly special report from ICAEW's Business and Management Faculty. Contents include: Motivating others is the key to courageous leadership; It is not just talk: you need to walk the walk; Leadership styles are changing, say directors; Courage in finance: how far can your leadership go?; Courage, compassion and the finance professional; What makes a CEO 'exceptional'?; How functional leaders become CEOs; The three most critical issues in business today; Previous special reports. (AI generated description)"
    * "Thought leadership report from ICAEW's Business and Management Faculty, part of its FinanceDirection programme. It provides a foundation for considering the key challenges and a reference source for those analysing or researching the role of the finance function. (AI generated description)"

relation_override: |
  **Relation (OPTIONAL)**
  - Multiple values allowed (return as array)
  - Name(s) of the collection, series or programme the document belongs to
  - Include every series or programme name printed in the document's banner or header (e.g. ["ICAEW Know-How", "Brexit Guide"]), spelled and hyphenated exactly as printed (e.g. "ICAEW Know-How", "Brexit Guide", not "ICAEW KNOW-HOW", "BREXIT GUIDE" when the banner uses all capitals; "Rapid Error Free Reporting" if printed without a hyphen)
  - If the document is one issue of a recurring publication (e.g. "The state of the economy", "Quarterly briefing"), include the publication name as a series (e.g. ["The State of the Economy"], ["ICAEW Know-How", "Quarterly Briefing"]), along with any banner names
  - Otherwise, do not use the document's own title or headings as a series name
  - Write series names in title case, with short words (a, and, of, the, to, in) in lower case (e.g. "Guidance to Good Practice", "The State of the Economy")
  - Do not use a description of the type of document as a series (e.g. "Annual Report", "Minutes", "AGM Minutes", "Helpsheet", "Representation", "Thought Leadership"); only use series or programme names printed in the document
  - If no series or programme name is printed, return an empty array ([])
  - Examples (not exhaustive): ["ICAEW Know-How", "Brexit Guide"], ["Audit Insights"], ["The State of the Economy"], ["Guidance to Good Practice"], ["Special Report"]

publisher_override: |
  **Publisher (REQUIRED)**
  - Single value only
  - Use publisher name as credited in the document
  - Use the organisation name shown in the document's branding or cover, not a legal name from the small print (e.g. "Chartered Accountants Ireland", not "The Institute of Chartered Accountants in Ireland")
  - For presentations, webinar slides and speeches by external speakers at ICAEW events, use "ICAEW", even if the slides carry the speaker's organisation's branding
  - If no publisher is explicitly credited:
    - For ICAEW publications, including ICAEW-branded material with no named author, use "ICAEW"
    - For external publications, use the organisation name if available
    - If no organisation is identified, return an empty string ("") rather than defaulting to "ICAEW"
  - Examples:
    * "ICAEW" (for ICAEW publications)
    * "Deloitte" (for Deloitte publications)
    * "" (if publisher cannot be determined)

contributor_override: |
  **Contributor (OPTIONAL)**
  - Multiple values allowed (return as array)
  - People and organisations that contributed to the content but are not the main creator: co-authors, editors, interviewees, panel members, sponsors and research partners
  - For letters and correspondence, include the recipient here
  - Do not include organisations or people that are only the subject of, or the audience for, the document (e.g. the body a consultation response is addressed to), or organisations whose guidance or legislation is summarised or quoted (e.g. HMRC, when a guide summarises HMRC guidance)
  - Do not repeat ICAEW here when it is already the creator or publisher
  - For newsletters, briefings and other publications made up of articles, include the named article authors and the writer of any introduction or foreword, in the order they appear
  - For presentations, webinar slides and speeches by speakers from outside ICAEW, include the hosting ICAEW faculty here (e.g. ["Finance and Management Faculty"])
  - Use full names for people and external organisations; always write ICAEW as "ICAEW"
  - List contributors in the order they appear in the document
  - Examples: ["Deloitte"], ["The Pensions Regulator", "Financial Reporting Council"], ["Jane Brown", "Grant Thornton UK LLP"]

identifier_override: |
  **Identifier (OPTIONAL)**
  - Multiple values allowed (return as array)
  - ONLY include the following types of identifiers:
    * ISBNs (e.g., "ISBN 978-1-78915-123-4")
    * URLs (e.g., "https://www.icaew.com/123")
    * Clear ICAEW reference codes in these formats: TECPLN followed by 4 or 5 digits (e.g. TECPLN6855, TECPLN12949), TECH ##/##, TAXREP ##/##, ICAEW REP ##/##, METCAH##### (e.g., "TECH 01/24", "TECPLN12949", "TAXREP 4/10")
  - Only include a URL if it is the address of this document itself; links mentioned in the text are not identifiers (e.g. do not include a link to a campaign or hub page such as "icaew.com/brexit")
  - Do NOT include random strings of letters and numbers
  - Do NOT include unclear or ambiguous codes
  - If no clear identifiers are found, return an empty array ([])
  - Examples:
    * ["ISBN 978-1-78915-123-4"]
    * ["TECH 01/24"]
    * ["TECPLN12949"]
    * ["https://www.icaew.com/123"]

subject_topic_list_file: "profiles/topic_list.txt"
subject_max: 10

