# =============================================================================
# REVIEW COPY of profiles/icaew.yaml - NOT USED BY THE TOOL
#
# The original profile is unchanged below. Suggestions are inserted directly
# after the line they refer to, marked:   # [IMPROVEMENT SUGGESTION #n]
# Search for "IMPROVEMENT SUGGESTION" to step through them.
#
# Some suggestions sit inside prompt text blocks, so this copy should not be
# used as a profile. Accept or reject each one, then the agreed changes can be
# made to profiles/icaew.yaml.
#
# Suggestions about the generic rules shared by all profiles (Date, Type,
# Format, Source/Coverage/Rights, required fields...) are in
# review/config_annotated.py.
# =============================================================================

# ICAEW digital archive metadata extraction profile.
# Contains ICAEW-specific conventions layered on top of the Dublin Core schema.

name: "ICAEW"
description: "Metadata extraction profile for the ICAEW digital archive, following ICAEW-specific conventions based on the Dublin Core schema."

role: "You are a metadata archivist for the ICAEW digital archive. Your task is to analyse uploaded documents and extract structured metadata following ICAEW-specific conventions based on the Dublin Core schema and internal rules."

extra_guidelines:
  - >
    You may see text similar to this: "© ICAEW 2014 TECPLN12949 05/14". The "05/14"
    actually means that the document was created on 05/2014, so use that for the date
    across all fields. Use this logic whenever you see text similar to this.
  - >
    For the creator and contributor fields, always normalise
    "Institute of Chartered Accountants in England and Wales" to "ICAEW".
  - >
    ALWAYS use British English spelling throughout all metadata fields. Examples:
    "organise" (not "organize"), "colour" (not "color"), "centre" (not "center"),
    "analyse" (not "analyze"), "recognise" (not "recognize"), "realise" (not "realize"),
    "specialise" (not "specialize"), "summarise" (not "summarize"),
    "optimise" (not "optimize"), "finalise" (not "finalize"),
    "prioritise" (not "prioritize"), "authorise" (not "authorize"),
    "categorise" (not "categorize"), "characterise" (not "characterize"),
    "emphasise" (not "emphasize"), "minimise" (not "minimize"),
    "maximise" (not "maximize"), "criticise" (not "criticize"),
    "apologise" (not "apologize"), "memorise" (not "memorize"),
    # [IMPROVEMENT SUGGESTION #1] Proper names must be exempt from re-spelling. "Even if the source document
    #     uses American English" will turn "Center for Audit Quality" into "Centre for
    #     Audit Quality" and change the titles of US publications.
    #     Proposed addition: "Do not change the spelling of names of people,
    #     organisations, products or quoted titles of other publications."
    "standardise" (not "standardize"), "visualise" (not "visualize"),
    "labour" (not "labor"), "behaviour" (not "behavior"), "favour" (not "favor"),
    "honour" (not "honor"), "neighbour" (not "neighbor"),
    "defence" (not "defense"), "offence" (not "offense"),
    "licence" (noun, not "license"), "practice" (noun, not "practise"),
    "advice" (noun, not "advise"),
    "programme" (not "program" when referring to a schedule/plan),
    "catalogue" (not "catalog"), "dialogue" (not "dialog"),
    "analogue" (not "analog"), "manoeuvre" (not "maneuver"),
    "enrolment" (not "enrollment"), "fulfil" (not "fulfill"),
    "skilful" (not "skillful"), "travelled" (not "traveled"),
    "cancelled" (not "canceled"), "labelled" (not "labeled"),
    "modelling" (not "modeling"), "travelling" (not "traveling"),
    "jewellery" (not "jewelry"), "grey" (not "gray"),
    "cheque" (not "check" when referring to payment),
    "pyjamas" (not "pajamas"), "sceptical" (not "skeptical").
    This applies to all generated text, including descriptions and any text you create,
    even if the source document uses American English spelling. However, do not change the
    spelling of names of people, organisations, products or quoted titles of other
    publications (e.g. keep "Center for Audit Quality").
  - >
    For identifiers, only include ISBNs, URLs, and clear ICAEW reference codes (e.g. TECPLN#####, TECH ##/##, TAXREP ##/##, ICAEW REP ##/##, METCAH#####, "TECH 01/24", "TECPLN12949").
  - >
    Acronyms commonly found in ICAEW documents (such as OECD, IFRS, FRC, HMRC, UK, VAT, etc.)
    must ALWAYS be in all capitals. For example, always use "OECD" (not "Oecd"),
    "IFRS" (not "Ifrs"), "FRC" (not "Frc"). The exception is mixed-case brand names,
    which keep their own capitalisation (e.g. "eBook", "iXBRL").
  - >
    When using contextual background provided by the user, name the subject specifically
    (e.g. "Photograph showing Chartered Accountant's Hall, with...") rather than using
    generic terms ("a building", "an office block").

xip_fields: true

custom_fields:
  - id: "icaew:InternalReference"
    reserved: true
    multiple: false

  - id: "icaew:ContentType"
    reserved: false
    multiple: false
    prompt_text: |
      **icaew:ContentType (OPTIONAL)**
      - Single value only
      - Must use one of the following controlled vocabulary terms (exact spelling and case):
        * Annual report
        * Article
        * Biographical profile
        * Company profile
        * Course
        * Database
        * eBook
        * eBook chapter
        * Event
        * Form
        * Helpsheets and support
        * Hub page
        * ICAEW consultation and response
        * Industry profile
        * Internal ICAEW policy
        * Journal
        * Learning material
        * Legal precedent
        * Library book
        * Library journal
        * Listing
        * Member reward
        * Minutes and board papers
        * Newsletter
        * No content type
        * Podcast
        * Press release
        * Promotional material
        * Regional news
        * Regulations
        * Report
        * Representation
        * Research guide
        * Speech or presentation
        * Technical release
        * Thought leadership report
        * Transcript
        * Video
        * Webinar
        * Website
      - If the content type cannot be determined from the document, use "No content type"
      - Do not create new content types; only use the terms from this list

      ### Content Type Selection Guidelines (based on SiteCore metadata guide):

      **Annual report**
      - Use for: Annual reports and annual reviews
      - Examples: ICAEW annual report, ICAEW annual review, Faculty/District Society annual reports
      - Do not use for: Any other content

      **Article**
      - Use for: Content that could be an article in a magazine
      - Examples: PDF articles from Faculty magazines, articles from Practicewire/London Accountant/SIG newsletters, legal alerts
      - Do not use for: Press releases, regional news, complete journal issues, web pages that list articles

      **Database**
      - Check before using - requires verification

      **eBook**
      - Check before using - requires verification

      **eBook chapter**
      - Check before using - requires verification

      **Course**
      - Check before using - requires verification

      **Event**
      - Use for: Events in the Configio database
      - Do not use for: Other event-like content

      **Form**
      - Use for: Blank forms (online forms or PDF forms)
      - Examples: Online form web pages, media library PDF forms
      - Do not use for: Web pages that include forms alongside other information

      **Helpsheets and support**
      - Use for: Content providing practical advice, helpful assistance, and explanations
      - Examples: TAS/SIG helpsheets, Faculty practical guidance, Excel how-to guides, Atom Briefings, support pages
      - Do not use for: Technical releases, ICAEW regulations, web pages that list helpsheets

      **Hub page**
      - Use for: Content using the SiteCore hub page template
      - Do not use for: Other page types

      **ICAEW consultation and response**
      - Check before using - requires verification

      **Industry profile**
      - Check before using - requires verification

      **Internal ICAEW policy**
      - Check before using - requires verification

      **Journal**
      - Use for: Complete issues of journals
      - Examples: Complete PDF issues of Faculty magazines (e.g., Taxline issues)
      - Do not use for: Web pages that list articles from journals, individual articles

      **Learning material**
      - Use for: Learning and exam materials
      - Examples: Exam papers, mark schemes, syllabi, pass lists

      **Legal precedent**
      - Check before using - requires verification

      **Library book**
      - Check before using - requires verification

      **Library journal**
      - Check before using - requires verification

      **Listing**
      - Use for: Content that provides lists of links to other content
      - Examples: Web pages listing articles on topics, helpsheets, press releases, webinars, podcasts, A-Z listings
      - Do not use for: Web pages using SiteCore hub page template, web pages listing articles from journals

      **Member reward**
      - Check before using - requires verification

      **Minutes and board papers**
      - Check before using - requires verification

      **Newsletter**
      - Use for: Complete newsletters including several articles
      - Examples: Community newsletters, district society newsletters, complete issues of publications
      - Do not use for: Simple lists of articles from newsletters, individual newsletter articles, complete journal issues

      **No content type**
      - Use for: Content that doesn't conform to other content types and shouldn't be exposed in queries
      - Examples: Biographies of board members, administration pages, contact pages
      - Do not use for: Content that needs to be picked up by queries and included on automatically generated pages

      **Podcast**
      - Use for: Podcasts or content introducing a single podcast with a link
      - Do not use for: Web pages that list podcasts

      **Press release**
      - Use for: ICAEW press releases: documents headed as an ICAEW press release or media release, typically with a 'Notes to editors' section
      - Examples: Press releases from https://www.icaew.com/en/about-icaew/news/press-release-archive/
      - Do not use for: Web pages listing press releases, press release style content not on official Press Release pages

      **Promotional material**
      - Use for: Content promoting products, conferences, faculties, communities
      - Examples: Member offers, join pages, benefits pages, flyers

      **Regional news**
      - Use for: Press releases from ICAEW regions and district societies
      - Examples: Regional press releases from https://www.icaew.com/en/about-icaew/news/press-release-archive/regions-2017/
      - Do not use for: Web pages listing regional news, London Accountant articles

      **Regulations**
      - Use for: ICAEW regulations
      - Examples: Audit Regulations and Guidance, Code of Ethics, Insolvency Licensing Regulations, Probate and Compensation Scheme Regulations
      - Do not use for: Guidance supporting regulations, downloadable forms, non-ICAEW regulations, ICAEW Charter and bye-laws

      **Report**
      - Use for: Content in report format
      - Examples: Research reports, briefing documents, web pages providing access to reports
      - Do not use for: Technical releases, annual reports, web pages listing reports

      **Representation**
      - Use for: ICAEW representations to governments and other bodies
      - Examples: ICAEW REP PDFs
      - Do not use for: Web pages listing ICAEW REPs

      **Research guide**
      - Check before using - requires verification

      **Speech or presentation**
      - Check before using - requires verification

      **Technical release**
      - Use for: Technical releases in any technical release series
      - Examples: Technical release PDFs, web pages introducing single technical releases
      - Do not use for: Web pages listing technical releases

      **Thought leadership report**
      - Use for: Thought leadership initiative reports (must be labelled as thought leadership within the text)
      - Do not use for: Web pages listing thought leadership reports, reports with thought leadership elements but not labelled as such

      **Transcript**
      - Check before using - requires verification

      **Video**
      - Check before using - requires verification

      **Webinar**
      - Use for: Webinars or content introducing a single webinar with a link
      - Do not use for: Web pages listing webinars

      **Website**
      - Check before using - requires verification

  - id: "icaew:Notes"
    reserved: false
    multiple: false
    prompt_text: |
      **icaew:Notes (OPTIONAL)**
      - Single value only
      - Use for any additional notes or comments about the document
      # [IMPROVEMENT SUGGESTION #11] Contradicts the generic guideline "Do not add explanatory text or notes in
      #     the metadata values", and is open-ended, so the model may fill it
      #     inconsistently. Proposed: either define exactly what goes here, e.g.
      #     "Only note: incomplete/partial document; handwritten content; poor scan
      #     quality; document not in English; draft or marked confidential",
      #     or mark the field reserved (reserved: true).
      - If no notes are needed, return an empty string ("")

title_override: |
  **Title (REQUIRED)**
  - Single value only
  - Use the title as it appears in the document
  - Use sentence case (capitalise first word only), but acronyms (e.g., OECD, IFRS, FRC, HMRC, UK, VAT) must always be in all capitals, even at the start of the title or after a colon
  - Proper nouns also keep their capitals (names of people, organisations, places, faculties, named publications and standards), e.g. "Financial Reporting Council"
  - ALWAYS use colons (:) to separate the main title from its subtitle only - replace any em-dashes (—), en-dashes (–), or hyphens (-) used as title/subtitle separators with colons
  - Do NOT use a colon before a date, issue/volume number, or reference code — use a comma instead (e.g., "A trustee perspective, 23rd July 2020" not "A trustee perspective: 23rd July 2020")
  - Do not capitalise the first letter after a colon
  - Do not use "&"; use "and", except within the name of an organisation or publication
  - Use question marks if applicable, but do not end with full stops
  - The order and format should be: title, subtitle, issue/volume, date — with commas separating each element after the subtitle
  - ALWAYS append the date to the end of the title if a date has been identified for the document. Do not omit it. Use the same level of precision as the date found: year only (e.g., "2021"), month and year (e.g., "March 2021"), or full date (e.g., "15th March 2021")
  # [IMPROVEMENT SUGGESTION #14] Two of the examples below have no date ("IFRS 16 leases" and
  #     "Audit firm governance: second consultation paper"). If those documents
  #     were undated, add "(undated document)" after them so the model doesn't
  #     learn that dates are optional; otherwise add the dates.
  - If a title does not follow this format, reorganise it accordingly. For example:
    * "UK business confidence monitor report: Q4 2012 Scotland" should become "UK business confidence monitor report: Scotland, Q4 2012"
  - Use readable date formatting in titles: "15th January 2024" format (e.g., "15th January 2024" not "2024-01-15" or "January 15, 2024")
  - Indicate if the content is revised or time-limited e.g. add 'revised' before the date: 'Audit regulations, revised March 2021'.
  - Use only standard ASCII characters - avoid Unicode characters, smart quotes, or special symbols
  # [IMPROVEMENT SUGGESTION #16] Decide whether £ and accented letters (e.g. "Café", "Société Générale")
  #     are allowed. Strict ASCII forces the model to drop or rewrite them
  #     ("£5m" -> "5m"/"GBP 5m"). The code now keeps them and only converts curly
  #     quotes, dashes and ellipses. Proposed: "Use straight quotes and
  #     apostrophes; £, € and accented letters in names are allowed".
  #     The same rule appears in the generic guidelines (config.py).
  - Examples:
    * "OECD discussion draft on the application of tax treaties to state-owned entities: including sovereign wealth funds, TAXREP 4/10, 22nd January 2010"
    * "IFRS 16 leases"
    * "Audit firm governance: a project for the Financial Reporting Council, Ernst and Young LLP response, 3rd February 2009"
    # [IMPROVEMENT SUGGESTION #17] "Ernst and Young LLP" - see #13 on "&" in organisation names.
    * "Audit firm governance: second consultation paper"
    * "Audit firm governance: evidence gathering consultation paper, 5th February 2009"
    * "Tax Faculty newsletter, Issue 15, 15th March 2024"
    # [IMPROVEMENT SUGGESTION #18] "Issue" is capitalised, which breaks sentence case as written. Choose
    #     "issue 15" or state that "Issue"/"Volume"/"No." are capitalised.
    * "Technical release: IFRS 9 implementation, TECH 01/24, 15th January 2024"
    * "A trustee perspective, 23rd July 2020" (comma before date — NOT a colon)
    * "How to succeed in an interview, 2021" (date always appended, year-only precision when only a year is known)

creator_override: |
  **Creator (REQUIRED)**
  - Multiple values allowed (return as array)
  - Order of creators (from most specific to most general):
    1. Individual authors (e.g., "John Smith")
    2. Faculty or department (e.g., "Financial Services Faculty")
    3. Institution or organisation (e.g., "ICAEW")
  - If the creator cannot be identified, return an empty array ([])
  - For corporate authors, list the organisation name
  - For letters and correspondence: include sender first, then recipient if both are clearly identified (e.g., ["John Smith", "Ernst and Young LLP"])
  # [IMPROVEMENT SUGGESTION #19] In Dublin Core the recipient of a letter is not a creator. Proposed:
  #     sender(s) in Creator; recipient in Contributor (or mentioned in the
  #     Description).
  - Use full names when available (e.g., "John Smith" not "J. Smith")
  - Use consistent formatting: "First Name Last Name" or "Organisation Name"
  - Examples:
    * ["John Smith", "Financial Services Faculty", "ICAEW"]
    * [] (if creator cannot be identified)
    * ["ICAEW Technical Department"]
    # [IMPROVEMENT SUGGESTION #20] Doesn't follow the specific-to-general pattern used for faculties.
    #     Proposed: ["Technical Department", "ICAEW"].
    * ["Sarah Jones", "Tax Faculty", "Deloitte"]
    # [IMPROVEMENT SUGGESTION #21] Confusing example: the Tax Faculty is part of ICAEW, but the chain ends
    #     in Deloitte, which breaks the "most specific to most general" order. Either
    #     ["Sarah Jones", "Tax Faculty", "ICAEW"] or ["Sarah Jones", "Deloitte"].
    * ["David Tweedie", "Ernst and Young LLP"]
    * ["Mike Ashley", "KPMG Europe LLP"]

description_override: |
  **Description (REQUIRED)**
  - Single value only
  - Briefly summarise the content - quite often a summary will be present in the document itself, if so make use of it
  - Every description should at least describe what the document is (e.g. what type of document it is, who authored it) and what it is about
  - For transcript files: describe the video or podcast content itself, not the transcript document. Write the description from the perspective of describing the original media (video/podcast), not as "a transcript of..." or "transcript of a...". The description should read as if it is describing the video or podcast directly.
  - Listing of contents may be helpful - but they are of secondary importance. Each item in the list of contents should be separated by a semicolon.
  # [IMPROVEMENT SUGGESTION #22] Two clashes with the examples:
  #     (a) The examples introduce the list with "Contents include:" but the rule
  #     doesn't say to. Proposed: "Introduce the list with 'Contents include:'".
  #     (b) The generic guideline turns dashes used as separators into colons in
  #     every field, but the examples keep " - " inside article titles
  #     ("Wanted urgently - the T-shaped finance director"). Decide whether the
  #     dash rule applies to titles only (recommended) or the examples should
  #     change. The code's text cleaning also converts em dashes to colons in
  #     every field; it should be changed to match your decision.
  - Should always finish with a full stop or question mark
  - Use British English spelling throughout the description
  - After the description append the string "(AI generated description)"
  - Examples:
    * "Technical guidance on implementing IFRS 9 for financial instruments. (AI generated description)"
    * "This Audit and Assurance Faculty guidance sets out the steps auditors need to take to ascertain whether material uncertainty disclosures in relation to going concern in the financial statements are adequate, and how these disclosures will then impact the audit report. It supplements the guidance in the faculty's audit report guides. (AI generated description)"
    * "A quarterly special report published by the Business and Management Faculty. Contents include: Motivating others is the key to courageous leadership; It is not just talk: you need to walk the walk; Leadership styles are changing, say directors; Courage in finance: how far can your leadership go?; Courage, compassion and the finance professional; What makes a CEO 'exceptional'?; How functional leaders become CEOs; The three most critical issues in business today; Previous special reports. (AI generated description)"
    * "This publication forms part of the FinanceDirection thought leadership programme of the ICAEW Business and Management Faculty; it provides a foundation for considering the key challenges and a reference source for those analysing or researching the role of the finance function. (AI generated description)"

relation_override: |
  **Relation (OPTIONAL)**
  - Multiple values allowed (return as array)
  - Name of the collection or series the document belongs to
  - Examples (not exhaustive): ["Technical Release"], ["Faculty Publication"], ["Annual Report"], ["Special Report"], ["Tax Representation"], ["Audit Insights"], ["Thought Leadership"]
  # [IMPROVEMENT SUGGESTION #23] No fixed list, so expect variants ("Technical Releases", "Tech release",
  #     "Technical release series"). The casing (title case) also differs from
  #     content types ("Technical release"). Proposed: a controlled list of
  #     series names with fixed spelling, plus "if none of these fits, use the
  #     series name exactly as printed in the document".

publisher_override: |
  **Publisher (REQUIRED)**
  - Single value only
  - Use publisher name as credited in the document
  - If no publisher is explicitly credited:
    - For ICAEW publications, use "ICAEW"
    - For external publications, use the organisation name if available
    - If no organisation is identified, return an empty string ("") rather than defaulting to "ICAEW"
  - Examples:
    * "ICAEW" (for ICAEW publications)
    * "Deloitte" (for Deloitte publications)
    * "" (if publisher cannot be determined)

contributor_override: |
  **Contributor (OPTIONAL)**
  - Multiple values allowed (return as array)
  - Used for external institutions involved (i.e. not ICAEW)
  # [IMPROVEMENT SUGGESTION #24] Questions:
  #     (a) Should individuals (editors, interviewees, panel members) be included?
  #     "Institutions" excludes them.
  #     (b) Define "involved": the OECD example (#29) lists the body ICAEW is
  #     responding to, which in Dublin Core terms is not a contributor.
  #     Proposed: "Organisations that contributed to the content (co-authors,
  #     sponsors, research partners). Do not include organisations that are
  #     only the subject of, or the audience for, the document."
  #     (c) "Use full organisation names" conflicts with normalising
  #     ICAEW's full name to "ICAEW" - add "except ICAEW".
  - Use full organisation names
  - Examples: ["Deloitte"], ["The Pensions Regulator", "Financial Reporting Council"]

identifier_override: |
  **Identifier (OPTIONAL)**
  - Multiple values allowed (return as array)
  - ONLY include the following types of identifiers:
    * ISBNs (e.g., "ISBN 978-1-78915-123-4")
    * URLs (e.g., "https://www.icaew.com/123")
    * Clear ICAEW reference codes (e.g., "TECH 01/24", "TECPLN12949")
    # [IMPROVEMENT SUGGESTION #25] See #2 - list the known code formats.
    #     Consider adding:
    #     * ISSNs (e.g. "ISSN 1234-5678") - important for Journal/Newsletter items
    #     * DOIs (e.g. "doi:10.1234/abcd")
    #     and limit URLs to the document's own address: "Only include a URL if it
    #     is the address of this document itself, not links mentioned in the
    #     text"
  - Do NOT include random strings of letters and numbers
  - Do NOT include unclear or ambiguous codes
  - If no clear identifiers are found, return an empty array ([])
  - Examples:
    * ["ISBN 978-1-78915-123-4"]
    * ["TECH 01/24"]
    * ["TECPLN12949"]
    * ["https://www.icaew.com/123"]

subject_topic_list_file: "profiles/topic_list.txt"
subject_max: 10
# [IMPROVEMENT SUGGESTION #26] The validation rule at the bottom hard-codes "maximum of 10 subjects".
#     If subject_max changes, the two will disagree. Proposed: remove the number
#     from the rule (the prompt builder already states the limit from this
#     setting).

